# Bolt OTP Checkout API
#
# Machine-readable spec, identical in content to openapi.json, which it is generated
# from so the two cannot drift apart.
#
# Note: this file previously declared `"openapi": "2.0.0"` (Swagger 2.0) while being
# written in JSON syntax despite the .yaml extension, and openapi.json was OpenAPI
# 3.0.3 - the README pointed at both as "the spec", and they disagreed. Both are now
# OpenAPI 3.0.3.
$schema: https://openapi.org/schema/3.0.0.json
openapi: 3.0.3
info:
  title: Bolt OTP Checkout API
  version: 1.0.0
  description: Registration with generated 6-digit login codes, background email recognition, OTP verification
    and checkout persistence.
servers:
- url: http://localhost:8080
  description: Local development
paths:
  /api/health:
    get:
      summary: Liveness probe used by deployment platforms
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: UP
  /api/auth/register:
    post:
      summary: Register a user and issue a 6-digit login code
      description: The plain code is returned only here so the UI can display it. Only its BCrypt hash
        is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - firstName
              - lastName
              properties:
                email:
                  type: string
                  format: email
                  example: vijay@example.com
                firstName:
                  type: string
                  example: Vijay
                lastName:
                  type: string
                  example: Hosapeti
      responses:
        '201':
          description: Registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registration successful
                  code:
                    type: string
                    example: '482193'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/auth/recognize:
    get:
      summary: Check whether an email belongs to a registered user
      description: Called in the background by the checkout form. Returns nothing beyond a boolean so
        no personal data is exposed.
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Recognition result
          content:
            application/json:
              schema:
                type: object
                properties:
                  registered:
                    type: boolean
              examples:
                registered:
                  value:
                    registered: true
                unknown:
                  value:
                    registered: false
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/auth/verify:
    post:
      summary: Verify a 6-digit login code and sign the user in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - code
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  pattern: ^\d{6}$
                  example: '482193'
      responses:
        '200':
          description: Code accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  userId:
                    type: integer
                    example: 1
                  firstName:
                    type: string
                    example: Vijay
                  lastName:
                    type: string
                    example: Hosapeti
                  sessionToken:
                    type: string
                    description: Short-lived HMAC-signed token. Send as the X-Session-Token header on
                      checkout.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Incorrect code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No account for that email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/checkout:
    post:
      summary: Persist a checkout record
      description: With a valid X-Session-Token the record is linked to the authenticated user; otherwise
        user_id is null (guest checkout). No payment processing is performed.
      parameters:
      - name: X-Session-Token
        in: header
        required: false
        schema:
          type: string
        description: Token returned by POST /api/auth/verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - phone
              - shippingAddress
              properties:
                email:
                  type: string
                  format: email
                phone:
                  type: string
                  example: '+919876543210'
                shippingAddress:
                  type: string
                  example: Bengaluru, Karnataka, India
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Checkout submitted successfully
        '400':
          $ref: '#/components/responses/BadRequest'
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        message:
          type: string
          example: Invalid email address
        path:
          type: string
          example: /api/auth/register
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
