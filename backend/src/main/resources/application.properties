spring.application.name=bolt-checkout

# ---------------------------------------------------------------------------
# Datasource - every value comes from the environment so no credential is
# committed to the repository. See backend/.env.example.
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/bolt_checkout?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------------------
# JPA - schema is owned by database/schema.sql, so Hibernate only validates.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# CORS - production should be the exact deployed Vercel origin (comma separated).
# ---------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ---------------------------------------------------------------------------
# Session token signing secret for post-OTP login (see SessionTokenService).
# ---------------------------------------------------------------------------
session.token.secret=${SESSION_TOKEN_SECRET:local-dev-only-change-me-0123456789abcdef}

# ---------------------------------------------------------------------------
# OTP hardening. A 6-digit code has a million possible values, so a single
# BCrypt comparison is not enough on its own: the code expires, repeated
# wrong guesses lock the account, and each IP is rate limited per minute.
# ---------------------------------------------------------------------------
otp.ttl-minutes=${OTP_TTL_MINUTES:10}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
otp.lockout-minutes=${OTP_LOCKOUT_MINUTES:15}

# Per-IP requests allowed per minute. 0 disables the limiter.
rate-limit.verify-per-minute=${RATE_LIMIT_VERIFY_PER_MINUTE:10}
rate-limit.recognize-per-minute=${RATE_LIMIT_RECOGNIZE_PER_MINUTE:60}

# ---------------------------------------------------------------------------
# Response security headers. HSTS is only emitted over an already-secure request,
# and should be switched on once the API is served over HTTPS in production.
# ---------------------------------------------------------------------------
security.hsts-enabled=${HSTS_ENABLED:false}

# ---------------------------------------------------------------------------
# Web server - PORT is respected so Render can assign a dynamic port.
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------------
# Logging - OTP values are never logged by the application.
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bolt.checkout=INFO