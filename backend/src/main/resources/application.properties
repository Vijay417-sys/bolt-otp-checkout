spring.application.name=bolt-checkout

# ---------------------------------------------------------------------------
# Datasource - every value comes from the environment so no credential is
# committed to the repository. See backend/.env.example.
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/bolt_checkout?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=10000

# ---------------------------------------------------------------------------
# JPA - schema is owned by database/schema.sql, so Hibernate only validates.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------------------------------------------------------------------------
# CORS - production should be the exact deployed Vercel origin (comma separated).
# ---------------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ---------------------------------------------------------------------------
# Session token signing secret for post-OTP login (see SessionTokenService).
# ---------------------------------------------------------------------------
session.token.secret=${SESSION_TOKEN_SECRET:local-dev-only-change-me-0123456789abcdef}

# ---------------------------------------------------------------------------
# Web server - PORT is respected so Render can assign a dynamic port.
# ---------------------------------------------------------------------------
server.port=${PORT:8080}
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# ---------------------------------------------------------------------------
# Logging - OTP values are never logged by the application.
# ---------------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.bolt.checkout=INFO