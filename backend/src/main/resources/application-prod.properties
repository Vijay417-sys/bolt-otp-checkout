# Production profile.
#
# Activated with: java -jar app.jar --spring.profiles.active=prod
# Render can set SPRING_PROFILES_ACTIVE=prod.
#
# Differences from the default profile:
#  - the development SESSION_TOKEN_SECRET fallback is rejected at startup
#  - schema validation is mandatory (no accidental DDL)
#  - stack traces and binding errors are never included in responses

spring.jpa.hibernate.ddl-auto=validate

server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-exception=false

# Conservative logging in production.
logging.level.root=WARN
logging.level.com.bolt.checkout=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n
