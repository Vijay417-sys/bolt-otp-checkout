# Test profile.
#
# The real database/schema.sql is loaded into H2 running in MySQL compatibility
# mode, and Hibernate is set to `validate` - the same production setting. This
# means the test suite exercises the exact committed schema (including the
# foreign key and its ON DELETE SET NULL rule) instead of a Hibernate-generated
# approximation, and fails if the entities and the schema ever drift apart.
#
# Override the schema path with -Dschema.file=/abs/path/schema.sql if needed.
spring.datasource.url=jdbc:h2:mem:bolt_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Load database/schema.sql, which is the authoritative schema definition.
spring.sql.init.mode=always
spring.sql.init.schema-locations=${schema.file:../database/schema.sql}
spring.sql.init.continue-on-error=false

cors.allowed-origins=http://localhost:5173
session.token.secret=test-secret-value-0123456789abcdef

logging.level.org.hibernate.SQL=warn
logging.level.com.bolt.checkout=warn
