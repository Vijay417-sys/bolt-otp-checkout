# Security headers, kept in one file because nginx replaces the whole inherited
# add_header set as soon as a block declares one of its own. Any location that sets
# Cache-Control must therefore `include` this file as well, or it silently loses
# every header listed here.
#
# 'always' is required: without it nginx omits the header on error responses, which
# are exactly the ones worth hardening.
#
# The CSP is deliberately strict. The app is a static bundle plus fetch() calls to
# the API, so nothing else needs to load. 'unsafe-inline' is limited to styles -
# Vite injects a style element at runtime - and is absent from script-src.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https:; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
