services:
  db:
    image: mysql:8
    container_name: bolt-db
    environment:
      MYSQL_DATABASE: bolt_checkout
      # Dedicated application user - the root account is never used by the app.
      MYSQL_USER: ${MYSQL_USER:-bolt}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-boltpw}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
    ports:
      - "3306:3306"
    volumes:
      # Applied once, on first initialisation of an empty data directory.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: bolt-backend
    environment:
      DATABASE_URL: jdbc:mysql://db:3306/bolt_checkout?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
      DATABASE_USERNAME: ${MYSQL_USER:-bolt}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD:-boltpw}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      # Must match the development default in application.properties exactly.
      # SessionTokenService refuses to start on the prod profile while this value
      # is in use, so a different default here would let a deployment pass that
      # guard while signing tokens with a publicly known secret.
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET:-local-dev-only-change-me-0123456789abcdef}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: bolt-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  mysqldata:
