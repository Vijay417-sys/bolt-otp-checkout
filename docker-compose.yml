services:
  db:
    image: postgres:16-alpine
    container_name: bolt-db
    environment:
      POSTGRES_DB: bolt_checkout
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # Applied once, on first initialisation of an empty data directory.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bolt_checkout"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: bolt-backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/bolt_checkout
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      SESSION_TOKEN_SECRET: ${SESSION_TOKEN_SECRET:-local-dev-secret-0123456789abcdef}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
    container_name: bolt-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started

volumes:
  pgdata:
